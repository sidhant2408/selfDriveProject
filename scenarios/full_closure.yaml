# Scenario C: full road closure.
#
# A line of cones at s = 40 spans BOTH same-direction lanes (d = -1.5 .. 4.5,
# every 0.75 m). The largest free gap after a 0.40 m margin is far narrower than
# the 2.09 m car. Both lanes are permitted, but neither is passable, and crossing
# into opposite traffic is not allowed. Correct behaviour: stop before s = 40.
# One cone is fallen, lying ACROSS the road (yaw offset 90 deg).
# Road frame: s along ego-lane centre, d positive to the LEFT.
name: full_closure_C
description: >
  Nine-cone barrier across both same-direction lanes at s = 40 m, including one
  fallen cone. The goal beyond it is unreachable; the ego must stop.
map: Town10HD_Opt
seed: 42

# Evaluation-only label. Pipeline modules must NEVER read this field.
ground_truth_label: CLOSURE

route:
  anchor: {x: -24.34, y: -57.79}
  expected_road_id: 7
  expected_lane_id: -2
  length_m: 85.0
  sample_spacing_m: 1.0

ego: {s: 0.0, d: 0.0, spawn_z_offset_m: 0.3}

goal: {s_min: 70.0, s_max: 80.0, d_min: -1.75, d_max: 5.25}   # unreachable by design

corridors:
  - {name: ego_lane,  s_start: 0.0, s_end: 85.0, d_min: -1.75, d_max: 1.75}
  - {name: left_lane, s_start: 0.0, s_end: 85.0, d_min: 1.75,  d_max: 5.25}

cone_defaults:
  blueprint: static.prop.constructioncone
  upright: {length: 0.48, width: 0.48}
  fallen:  {length: 0.72, width: 0.48}

cones:
  - {id: c0, s: 40.0, d: -1.50, state: upright}
  - {id: c1, s: 40.0, d: -0.75, state: upright}
  - {id: c2, s: 40.0, d:  0.00, state: upright}
  - {id: c3, s: 40.0, d:  0.75, state: fallen, yaw_offset_deg: 90}   # lying across the road
  - {id: c4, s: 40.0, d:  1.50, state: upright}
  - {id: c5, s: 40.0, d:  2.25, state: upright}
  - {id: c6, s: 40.0, d:  3.00, state: upright}
  - {id: c7, s: 40.0, d:  3.75, state: upright}
  - {id: c8, s: 40.0, d:  4.50, state: upright}
